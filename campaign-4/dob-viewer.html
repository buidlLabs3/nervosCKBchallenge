<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOB Viewer — CKB Testnet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.2rem; color: #fff; }
    .sub { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 560px; margin-bottom: 1rem; }
    .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 0.2rem; }
    .val { font-family: monospace; font-size: 0.82rem; color: #a5d6ff; word-break: break-all; line-height: 1.5; }
    .val a { color: #58a6ff; text-decoration: none; }
    .val a:hover { text-decoration: underline; }
    #img { max-width: 100%; border-radius: 8px; border: 2px solid #2a2a4a; display: none; }
    #status { color: #888; font-size: 0.9rem; }
    .err { color: #f85149; }
    .row { display: flex; gap: 1.5rem; justify-content: center; margin-top: 1rem; }
    .stat { text-align: center; }
    .stat .n { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .stat .l { font-size: 0.65rem; color: #888; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>🔗 DOB Viewer</h1>
  <p class="sub">Digital Object on CKB Testnet — fetched live from chain</p>
  <p id="status">Loading DOB from testnet…</p>

  <div id="result" style="display:none; width:100%; max-width:560px;">
    <div class="card" style="text-align:center;">
      <img id="img" alt="On-chain image" />
      <div class="row">
        <div class="stat"><div class="n" id="sz">—</div><div class="l">Bytes</div></div>
        <div class="stat"><div class="n" id="ct">—</div><div class="l">Type</div></div>
      </div>
    </div>
    <div class="card">
      <div class="label">Spore ID</div><div class="val" id="sid">—</div>
    </div>
    <div class="card">
      <div class="label">Transaction</div>
      <div class="val"><a id="txl" href="#" target="_blank">—</a></div>
    </div>
    <div class="card">
      <div class="label">Owner Lock</div><div class="val" id="lck">—</div>
    </div>
  </div>

<script>
const RPC = 'https://testnet.ckb.dev/';
const TX = '0x350eae0108263aca8e8495498d8e04530d4230b5333ac9ed99d8b6ba404c606d';
const EX = 'https://testnet.explorer.nervos.org/transaction/';

async function rpc(method, params) {
  const r = await fetch(RPC, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params })
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result;
}

function hexToBytes(hex) {
  hex = hex.startsWith('0x') ? hex.slice(2) : hex;
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) {
    bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return bytes;
}

function u32le(bytes, off) {
  return bytes[off] | (bytes[off+1] << 8) | (bytes[off+2] << 16) | (bytes[off+3] << 24);
}

// Parse SporeData by finding the content_type marker
// Format: [header] [ct_len:u32] [ct:bytes] [content_len:u32] [content:bytes]
function parseSporeData(cellHex) {
  const raw = hexToBytes(cellHex);

  // Search for known MIME types in the data
  const mimeTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'text/plain'];

  for (const mime of mimeTypes) {
    const mimeBytes = new TextEncoder().encode(mime);
    for (let i = 0; i < raw.length - mimeBytes.length; i++) {
      let match = true;
      for (let j = 0; j < mimeBytes.length; j++) {
        if (raw[i + j] !== mimeBytes[j]) { match = false; break; }
      }
      if (match) {
        // Found the MIME type at position i.
        // The 4 bytes before it should be the content_type length (u32 LE)
        const ctLen = u32le(raw, i - 4);
        if (ctLen === mime.length) {
          // The content_type length matches! Extract content after.
          const contentStart = i + mime.length;
          const contentLen = u32le(raw, contentStart);
          const content = raw.slice(contentStart + 4, contentStart + 4 + contentLen);
          return { contentType: mime, content };
        }
      }
    }
  }

  throw new Error('Could not parse SporeData — no supported MIME type found');
}

async function main() {
  const st = document.getElementById('status');
  try {
    const resp = await rpc('get_live_cell', [{ tx_hash: TX, index: '0x0' }, true]);
    if (!resp || !resp.cell) throw new Error('Cell not found on testnet');
    if (!resp.cell.data || !resp.cell.data.content) throw new Error('Cell has no data');

    const spore = parseSporeData(resp.cell.data.content);

    // Create image from content bytes
    const blob = new Blob([spore.content], { type: spore.contentType });
    const url = URL.createObjectURL(blob);
    document.getElementById('img').src = url;
    document.getElementById('img').style.display = 'inline';

    // Stats
    document.getElementById('sz').textContent = spore.content.length.toLocaleString();
    document.getElementById('ct').textContent = spore.contentType;
    document.getElementById('sid').textContent = resp.cell.output.type?.args || '—';
    document.getElementById('txl').textContent = TX;
    document.getElementById('txl').href = EX + TX;
    document.getElementById('lck').textContent = resp.cell.output.lock?.args || '—';

    st.style.display = 'none';
    document.getElementById('result').style.display = 'block';
  } catch (e) {
    st.innerHTML = '<span class="err">Error: ' + e.message + '</span>';
    console.error(e);
  }
}

main();
</script>
</body>
</html>
